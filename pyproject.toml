[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-types"
version = "0.1.2"
description = "Scientific type definitions (ArrayLike, ColorLike) and validation"
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
pandas = ["pandas"]
xarray = ["xarray"]
torch = ["torch"]
all = ["numpy", "pandas", "xarray", "torch"]
dev = ["pytest", "pytest-cov", "numpy"]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-types"
Repository = "https://github.com/ywatanabe1989/scitex-types"
Issues = "https://github.com/ywatanabe1989/scitex-types/issues"

[project.entry-points."scitex_dev.docs"]
scitex-types = "scitex_types"

[project.entry-points."scitex_dev.skills"]
scitex-types = "scitex_types"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_types"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
